name: Vectraa quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and native build dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @rollup/rollup-linux-x64-gnu --no-audit --no-fund
        env:
          npm_config_cpu: wasm32
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Validate deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/robots.txt
          test -f dist/site.webmanifest
          test -d dist/assets
          find dist/assets -type f | grep -q .
          grep -q 'Vectraa' dist/index.html
          grep -q 'Content-Security-Policy' dist/_headers
          grep -q 'User-agent:' dist/robots.txt
          grep -q '"name": "Vectraa' dist/site.webmanifest
          if find dist -type f -name '*.map' | grep -q .; then
            echo 'Unexpected source maps found in production bundle.' >&2
            exit 1
          fi
          echo "Deployable bundle size: $(du -sh dist | cut -f1)"
      - name: Preserve deployable bundle
        uses: actions/upload-artifact@v4
        with:
          name: vectraa-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
