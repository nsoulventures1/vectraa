name: Vectraa quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm install --no-save typescript@5.9.3 vite@7.2.0 vitest@3.2.4 @vitejs/plugin-react@5.1.0 @types/node@24.10.0 @types/react@19.2.0 @types/react-dom@19.2.0 --no-audit --no-fund
      - run: npm test
      - run: npm run build
